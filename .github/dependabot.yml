version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    # A group holds packages that are released together or pin each other's versions, so that one
    # breaking package blocks only its own group. The first matching group wins, so the catch-all
    # group stays last.
    groups:
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis*"
      xunit:
        patterns:
          - "xunit*"
      dotnet-lts:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql*"
          - "Microsoft.SourceLink.*"
      critter-stack:
        patterns:
          - "Marten*"
          - "WolverineFx*"
      test-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "coverlet*"
          - "NSubstitute*"
          - "Testcontainers*"
          - "SSH.NET"
      thessera-dependencies:
        patterns:
          - "*"
    # Packages released in step with .NET move only to the next LTS major, by hand - see
    # docs/architecture/0023-dotnet-aligned-dependencies-follow-lts-only.md. Roslyn takes patches
    # only and is raised by hand with the SDK pin - see
    # docs/architecture/0024-roslyn-never-outruns-the-pinned-sdk-compiler.md.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.SourceLink.*"
        update-types: ["version-update:semver-major"]

  # Examples/*.csproj pin third-party packages (EF Core, Hosting, Marten, RabbitMQ.Client, ...)
  # literally, separate from Directory.Packages.props, because Examples deliberately does not use
  # central package management (see Examples/Directory.Build.props). The "/" entry above never
  # discovers these - Dependabot does not descend past the first nuget project it finds per
  # directory tree in the way this repo is laid out - so without this entry the Examples pins
  # drift silently, exactly as they did before this file was updated. The GaWeCodes.Thessera.*
  # family is excluded here: its version comes from $(ThesseraVersion) in
  # Examples/Directory.Build.props, refreshed manually after a local "dotnet pack" per
  # Examples/README.md, not from Dependabot.
  - package-ecosystem: nuget
    directory: "/Examples"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      xunit:
        patterns:
          - "xunit*"
      thessera-examples-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "GaWeCodes.Thessera.*"
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.SourceLink.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
